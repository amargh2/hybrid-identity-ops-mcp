[project]
name = "hybrid-identity-ops-mcp"
version = "0.1.0"
description = "Hybrid Active Directory, Entra ID, and Okta Migration Automation MCP Server"
authors = [
    { email = "margherioa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
hybrid-identity-ops-mcp = "hybrid_identity_ops_mcp:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
[tool.uv]
package = false
